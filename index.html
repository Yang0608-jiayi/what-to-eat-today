  /* 条件让步：先放「想吃面」，再放「清淡点」，硬忌口永不放宽 */
  function candidates(){
    var gentle = S.gentle, noodle = S.noodle, msg = "";
    var base = aiBase();
    var pool = base.filter(function(d){ return match(d, S.noSpicy, gentle, noodle); });

    if (!pool.length && noodle){
      noodle = false;
      pool = base.filter(function(d){ return match(d, S.noSpicy, gentle, noodle); });
      msg = "没有完全符合的，帮你放开了「想吃面」";
    }
    if (!pool.length && gentle){
      gentle = false;
      pool = base.filter(function(d){ return match(d, S.noSpicy, gentle, noodle); });
      msg = "没有完全符合的，帮你放开了「清淡点」";
    }
    /* 长按排除到无解时的兜底：清空排除集，保证永远摇得出来 */
    if (!pool.length && S.exclude.length){
      S.exclude = [];
      pool = base.filter(function(d){ return match(d, S.noSpicy, gentle, noodle); });
      msg = "排到没得选了，重新来过";
    }
    /* AI 的池子被上面的条件削到只剩一道：撤掉 AI 条件，回到全库 */
    if (S.ai && pool.length < 2){
      S.ai = null;
      syncAI();
      pool = DISHES.filter(function(d){ return match(d, S.noSpicy, gentle, noodle); });
      msg = "AI 挑的几道都被条件挡掉了，先用全部";
    }
    return { pool: pool, msg: msg };
  }

  function remaining(pool, ignoreRolled){
    if (ignoreRolled) return pool.slice();
    return pool.filter(function(d){ return S.rolled.indexOf(d.name) < 0; });
  }

  function pick(list){
    return list[Math.floor(Math.random() * list.length)];
  }

  /* ───────── 渲染 ───────── */
  function setState(s){
    S.state = s;
    viewSign.setAttribute("data-state", s);
    syncMeal();
  }

  function setEstate(s){
    E.state = s;
    viewElim.setAttribute("data-state", s);
    syncMeal();
  }

  function setPstate(s){
    P.state = s;
    viewPk.setAttribute("data-state", s);
    syncMeal();
  }

  function setChipsFaded(v){
    chips.classList.toggle("faded", !!v);
  }

  function aiHintText(){
    return S.ai ? ("AI 挑了 " + S.ai.names.length + " 道 · 点这里改条件") : "";
  }

  /* 提示行本来就有 1.5em 的固定高度，AI 条件借它显示 → 不占额外空间。
     有临时消息时消息优先，消息清空后条件自动回来。 */
  function setHint(text){
    var t = text || aiHintText();
    hintEl.textContent = t;
    hintEl.classList.toggle("on", !!t);
    hintEl.classList.toggle("ai", !text && !!S.ai);
  }

  /* ───────── 一餐：主食推导 / 汤 / 加菜 ───────── */
  function mealAccepted(){
    if (S.view === "elim") return E.state === "accepted";
    if (S.view === "pk")   return P.state === "accepted";
    return S.state === "accepted";
  }

  function baseIsStaple(){ return !!(MEAL.base && MEAL.base.staple === 1); }
  function baseIsSoup(){ return !!(MEAL.base && MEAL.base.soup === 1); }

  function mealNames(){
    var list = [];
    if (MEAL.base) list.push(MEAL.base.name);
    MEAL.sides.forEach(function(d){ list.push(d.name); });
    if (MEAL.soup) list.push(MEAL.soup.name);
    return list;
  }

  function mealParts(){
    if (!MEAL.base) return [];
    var parts = [MEAL.base.name];
    MEAL.sides.forEach(function(d){ parts.push(d.name); });
    /* 只有自带主食的才不配饭（面/饺/饭/粥/包…），汤也要配 */
    if (!baseIsStaple()) parts.push("米饭");
    if (MEAL.soup) parts.push(MEAL.soup.name);
    return parts;
  }

  function menuText(){ return mealParts().join(" + "); }

  /* 先守 chip 条件，再避开已有，最后避开今日摇过的 */
  function mealFilter(pool){
    var p = pool.filter(function(d){
      var t = d.tags;
      if (S.noSpicy && t.indexOf("辣") > -1) return false;
      if (S.gentle && t.indexOf("清淡") < 0) return false;
      return true;
    });
    if (!p.length){
      p = pool.filter(function(d){
        return !(S.noSpicy && d.tags.indexOf("辣") > -1);
      });
    }
    if (!p.length) p = pool.slice();

    var used = mealNames();
    var fresh = p.filter(function(d){ return used.indexOf(d.name) < 0; });
    if (fresh.length) p = fresh;

    var today = p.filter(function(d){ return S.rolled.indexOf(d.name) < 0; });
    if (today.length) p = today;
    return p;
  }

  function addSoup(){
    if (!MEAL.base || baseIsSoup()) return;
    var pool = mealFilter(DISHES.filter(function(d){ return d.soup === 1; }));
    if (!pool.length){ setHint("汤都喝遍了，今天先不配"); return; }
    MEAL.soup = pick(pool);
    syncMeal();
    playTick(true);
    vibrate(8);
    setHint("");
    liveEl.textContent = "配了 " + MEAL.soup.name;
  }

  function addSide(){
    if (!MEAL.base) return;
    if (MEAL.sides.length >= MEAL_MAX_DISHES - 1) return;
    var pool = mealFilter(DISHES.filter(function(d){
      return d.soup !== 1 && d.staple !== 1;
    }));
    if (!pool.length){ setHint("配菜挑不出来了，先这样"); return; }
    /* 荤素互补：整桌荤多了补素，素多了补荤 */
    var meat = 0, veg = 0;
    [MEAL.base].concat(MEAL.sides).forEach(function(d){
      if (d.tags.indexOf("荤") > -1) meat++;
      if (d.tags.indexOf("素") > -1) veg++;
    });
    var prefer = pool.filter(function(d){
      return (d.tags.indexOf("荤") > -1) === (meat <= veg);
    });
    MEAL.sides.push(pick(prefer.length ? prefer : pool));
    syncMeal();
    playTick(true);
    vibrate(8);
    setHint("");
    liveEl.textContent = "又加了 " + MEAL.sides[MEAL.sides.length - 1].name;
  }

  function startMeal(d){
    MEAL.base = d || null;
    MEAL.soup = null;
    MEAL.sides = [];
    syncMeal();
  }

  function clearMeal(){
    MEAL.base = null;
    MEAL.soup = null;
    MEAL.sides = [];
    syncMeal();
  }

  function currentMealBlock(){
    var view = S.view === "elim" ? viewElim : (S.view === "pk" ? viewPk : viewSign);
    return view ? view.querySelector(".meal") : null;
  }

  function syncMeal(){
    var on = !!MEAL.base && mealAccepted();
    pageEl.classList.toggle("meal-on", on);
    mealBlocks.forEach(function(el){ el.hidden = true; });
    if (!on) return;
    var block = currentMealBlock();
    if (!block) return;
    block.hidden = false;
    block.querySelector(".meal-list").textContent = mealParts().join(" · ");
    var soupBtn = block.querySelector(".meal-soup");
    var addBtn  = block.querySelector(".meal-add");
    if (baseIsSoup()){
      soupBtn.hidden = true;
    } else {
      soupBtn.hidden = false;
      soupBtn.textContent = MEAL.soup ? "换个汤" : "配个汤";
    }
    addBtn.hidden = MEAL.sides.length >= MEAL_MAX_DISHES - 1;
  }

  /* 落定回弹：只在非降级模式下播 */
  function settleSign(){
    if (reduced) return;
    sign.classList.remove("settling");
    void sign.offsetWidth;
    sign.classList.add("settling");
    setTimeout(function(){ sign.classList.remove("settling"); }, 200);
  }

  /* 同一会话第 3 次摇之后，提示一次长按，每天最多一次 */
  var TIP_TEXT = "老是摇不到？长按「再摇一签」可以跳过这一类";

  function maybeTip(msg){
    if (S.rollCount < 3) return;
    if (msg) return;
    if (read("jtsmc.tipSeen", "") === logicalDay()) return;
    setTimeout(function(){
      if (S.state !== "result") return;
      write("jtsmc.tipSeen", logicalDay());
      setHint(TIP_TEXT);
      setTimeout(function(){
        if (hintEl.textContent === TIP_TEXT) setHint("");
      }, 5000);
    }, 500);
  }

  function resetCopy(){
    copyBtn.hidden = true;
    copyBtn.textContent = "复制";
  }

  /* 字号按签的实际高度算，保证任何尺寸下都不压到下方的说明 */
  function sizeName(name){
    var h = sign.clientHeight || 300;
    var avail = Math.max(96, h - 74);
    var size = Math.min(31, avail / (Math.max(2, name.length) * 1.14));
    size = Math.max(15, size);
    nameEl.style.setProperty("--name-size", Math.round(size) + "px");
  }

  function showDish(d){
    nameEl.textContent = d.name;
    nameEl.classList.remove("blank");
    descEl.textContent = d.desc;
    sizeName(d.name);
  }

  function showBlank(){
    nameEl.textContent = "签";
    nameEl.classList.add("blank");
    nameEl.style.removeProperty("--name-size");
    descEl.textContent = "";
  }

  function toIdle(){
    setState("idle");
    showBlank();
    sealEl.classList.remove("stamped");
    primary.hidden = false;
    primary.disabled = false;
    primary.textContent = "摇一签";
    primary.dataset.action = "roll";
    secondary.hidden = true;
    resetCopy();
    setHint("");
    setChipsDisabled(false);
    setChipsFaded(false);
    S.dish = null;
    S.relaxMsg = "";
    clearMeal();
  }

  function toResult(d, msg){
    setState("result");
    S.dish = d;
    S.relaxMsg = msg || "";
    clearMeal();
    showDish(d);
    sealEl.classList.remove("stamped");
    primary.hidden = false;
    primary.disabled = false;
    primary.textContent = "就吃这个";
    primary.dataset.action = "accept";
    secondary.hidden = false;
    secondary.textContent = "再摇一签";
    secondary.dataset.action = "roll";
    resetCopy();
    setHint(msg);
    setChipsDisabled(false);
    setChipsFaded(false);
    liveEl.textContent = "今天吃 " + d.name;
    maybeTip(msg);
  }

  function toAccepted(){
    setState("accepted");
    primary.hidden = true;
    sealEl.classList.remove("stamped");
    void sealEl.offsetWidth;
    sealEl.classList.add("stamped");
    secondary.hidden = S.undone.indexOf(S.dish.name) > -1;
    secondary.textContent = "再想想";
    secondary.dataset.action = "undo";
    copyBtn.hidden = false;
    copyBtn.textContent = "复制";
    setChipsDisabled(true);
    setChipsFaded(true);
    liveEl.textContent = "就吃 " + S.dish.name;
    vibrate(20);
    playStamp();
    startMeal(S.dish);
  }

  function toExhausted(){
    setState("exhausted");
    nameEl.textContent = "今日签已尽";
    nameEl.classList.remove("blank");
    sizeName("今日签已尽");
    descEl.textContent = "明天再来";
    sealEl.classList.remove("stamped");
    primary.hidden = true;
    secondary.hidden = false;
    secondary.textContent = "不管了，随机来一个";
    secondary.dataset.action = "outlet";
    resetCopy();
    setHint("");
    setChipsDisabled(false);
    setChipsFaded(true);
    liveEl.textContent = "今日签已尽";
    clearMeal();
  }

  function setChipsDisabled(v){
    [chipNoSpicy, chipGentle, chipNoodle].forEach(function(c){ c.disabled = v; });
  }

  function syncChips(){
    chipNoSpicy.setAttribute("aria-pressed", String(S.noSpicy));
    chipGentle.setAttribute("aria-pressed", String(S.gentle));
    chipNoodle.setAttribute("aria-pressed", String(S.noodle));
  }

  function syncSound(){
    soundBtn.setAttribute("aria-pressed", String(S.muted));
    soundBtn.setAttribute("aria-label", S.muted ? "打开音效" : "静音");
    wavesEl.style.opacity = S.muted ? "0" : "1";
  }

  /* ───────── 摇签 ───────── */
  var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var rolling = false;

  function roll(ignoreRolled, notice){
    if (rolling) return;
    rolling = true;

    var c = candidates();
    var pool = c.pool;
    var list = remaining(pool, ignoreRolled);

    if (!list.length){
      /* AI 挑的这几道今天都摇过了：撤掉条件再摇，别直接判“签尽” */
      if (S.ai){
        S.ai = null;
        syncAI();
        c = candidates();
        pool = c.pool;
        list = remaining(pool, ignoreRolled);
        c.msg = "AI 挑的都吃过了，放开到全部";
      }
      if (!list.length){
        rolling = false;
        toExhausted();
        return;
      }
    }

    setState("rolling");
    setHint("");
    primary.disabled = true;
    secondary.hidden = true;
    resetCopy();
    setChipsDisabled(true);
    sealEl.classList.remove("stamped");

    var dur = reduced ? 150 : 500 + Math.round(Math.random() * 300);
    if (!reduced) sign.classList.add("shuffling");
    /* 声音比动效早约 25ms 收尾，最后那一下留给落定的"咚" */
    playRattle(reduced ? 0.12 : Math.max(0.16, dur / 1000 - 0.025), 1);

    var spinPool = pool.length ? pool : DISHES;
    var timer = setInterval(function(){
      showDish(spinPool[Math.floor(Math.random() * spinPool.length)]);
    }, 70);

    setTimeout(function(){
      clearInterval(timer);
      sign.classList.remove("shuffling");

      var d = pick(list);
      S.rolled.push(d.name);
      write("jtsmc.rolled", S.rolled);
      S.rollCount += 1;

      rolling = false;
      settleSign();
      playSettle();
      vibrate(12);
      toResult(d, notice || c.msg);
    }, dur);
  }

  function accept(){
    if (S.state !== "result" || !S.dish) return;
    toAccepted();
  }

  /* 撤销：仅一次，且该菜仍留在当日记录里 */
  function undo(){
    if (S.state !== "accepted" || !S.dish) return;
    if (S.undone.indexOf(S.dish.name) < 0){
      S.undone.push(S.dish.name);
      write("jtsmc.undone", S.undone);
    }
    sealEl.classList.remove("stamped");
    setState("result");
    showDish(S.dish);
    setHint(S.relaxMsg);
    primary.hidden = false;
    primary.disabled = false;
    primary.textContent = "就吃这个";
    primary.dataset.action = "accept";
    /* 撤销已用过，次要操作只剩「再摇一签」 */
    secondary.hidden = false;
    secondary.textContent = "再摇一签";
    secondary.dataset.action = "roll";
    resetCopy();
    setChipsDisabled(false);
    setChipsFaded(false);
    liveEl.textContent = "今天吃 " + S.dish.name;
  }

  /* ───────── 玩法二：划掉 ──────────── */
  var CARD_COUNT = 6;
  var FLAVORS = ["辣", "清淡", "重口"];
  var KINDS = ["荤", "素"];
  var drawing = false;

  function findCardEl(name){
    var kids = cardsEl.children;
    for (var i = 0; i < kids.length; i++){
      if (kids[i].dataset.name === name) return kids[i];
    }
    return null;
  }

  function aliveCards(){
    return E.cards.filter(function(c){ return !c.off; });
  }

  function shuffle(list){
    for (var i = list.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = list[i]; list[i] = list[j]; list[j] = t;
    }
    return list;
  }

  function cardTags(d){
    var t = [flavorOf(d)];
    if (d.tags.indexOf("面") > -1) t.push("面");
    if (d.tags.indexOf("海鲜") > -1) t.push("海鲜");
    return t;
  }

  /* 组内优先级：今天没摇过也没看过 → 没看过 → 都行 */
  function pickFresh(list){
    if (!list.length) return null;
    var seen = E.seen, rolled = S.rolled;
    var a = list.filter(function(d){
      return seen.indexOf(d.name) < 0 && rolled.indexOf(d.name) < 0;
    });
    if (a.length) return pick(a);
    var b = list.filter(function(d){ return seen.indexOf(d.name) < 0; });
    if (b.length) return pick(b);
    return pick(list);
  }

  /* 分层发牌：辣/清淡/重口 × 荤/素 各一张，海鲜保底，不够再补满 */
  function dealCards(){
    var pool = candidates().pool;
    var used = {};
    var out = [];

    FLAVORS.forEach(function(f){
      KINDS.forEach(function(k){
        if (out.length >= CARD_COUNT) return;
        var seg = pool.filter(function(d){
          return !used[d.name] && flavorOf(d) === f && d.tags.indexOf(k) > -1;
        });
        var d = pickFresh(seg);
        if (d){ used[d.name] = 1; out.push(d); }
      });
    });

    /* 海鲜保底：替掉一张非海鲜的牌 */
    var hasSea = out.some(function(d){ return d.tags.indexOf("海鲜") > -1; });
    if (!hasSea){
      var sea = pickFresh(pool.filter(function(d){
        return !used[d.name] && d.tags.indexOf("海鲜") > -1;
      }));
      if (sea){
        var idx = -1;
        for (var i = 0; i < out.length; i++){
          if (out[i].tags.indexOf("海鲜") < 0){ idx = i; break; }
        }
        if (idx > -1){
          delete used[out[idx].name];
          used[sea.name] = 1;
          out[idx] = sea;
        } else if (out.length < CARD_COUNT){
          used[sea.name] = 1;
          out.push(sea);
        }
      }
    }

    while (out.length < CARD_COUNT){
      var rest = pool.filter(function(d){ return !used[d.name]; });
      if (!rest.length) break;
      var extra = pickFresh(rest);
      used[extra.name] = 1;
      out.push(extra);
    }

    return out;
  }

  /* 一张牌：两个玩法共用同一套结构 */
  function cardButton(d){
    var b = document.createElement("button");
    b.type = "button";
    b.className = "card";
    b.dataset.name = d.name;
    b.setAttribute("aria-pressed", "false");

    var n = document.createElement("span");
    n.className = "card-name";
    n.textContent = d.name;

    var tags = document.createElement("span");
    tags.className = "card-tags";
    cardTags(d).forEach(function(t){
      var i = document.createElement("i");
      i.textContent = t;
      i.dataset.tag = t;
      tags.appendChild(i);
    });

    var desc = document.createElement("span");
    desc.className = "card-desc";
    desc.textContent = d.desc;

    var stamp = document.createElement("span");
    stamp.className = "card-stamp";
    stamp.setAttribute("aria-hidden", "true");
    stamp.textContent = "吃";

    b.appendChild(n);
    b.appendChild(tags);
    b.appendChild(desc);
    b.appendChild(stamp);
    return b;
  }

  function renderCards(){
    cardsEl.textContent = "";
    E.cards.forEach(function(item){
      var b = cardButton(item.d);
      if (item.off){
        b.classList.add("off");
        b.setAttribute("aria-pressed", "true");
      }
      cardsEl.appendChild(b);
    });
  }

  function syncElimChrome(){
    var alive = aliveCards().length;

    if (E.state === "pick"){
      elimCount.textContent = "还剩 " + alive + " 道";
      elimPrimary.hidden = false;
      elimPrimary.textContent = alive > 1 ? "从这 " + alive + " 个里抽一个" : "就吃这个";
      elimPrimary.dataset.action = alive > 1 ? "draw" : "accept";
      elimShuffle.hidden = false;
      elimUndo.hidden = true;
      elimCopy.hidden = true;
    } else if (E.state === "result"){
      elimCount.textContent = "就它了";
      elimPrimary.hidden = false;
      elimPrimary.textContent = "就吃这个";
      elimPrimary.dataset.action = "accept";
      elimShuffle.hidden = true;
      elimUndo.hidden = false;
      elimUndo.textContent = "再想想";
      elimCopy.hidden = true;
    } else if (E.state === "accepted"){
      elimCount.textContent = "";
      elimPrimary.hidden = true;
      elimShuffle.hidden = true;
      elimUndo.hidden = S.undone.indexOf(E.winner.name) > -1;
      elimUndo.textContent = "再想想";
      elimCopy.hidden = false;
      elimCopy.textContent = "复制";
    } else {
      elimCount.textContent = "抽一个…";
      elimPrimary.hidden = true;
      elimShuffle.hidden = true;
      elimUndo.hidden = true;
      elimCopy.hidden = true;
    }

    setChipsDisabled(E.state === "draw");
    setChipsFaded(E.state === "accepted");
  }

  /* 重新发牌：当前 6 张进「看过」集合，换一组不再撞车 */
  function elimReset(){
    E.cards.forEach(function(c){
      if (E.seen.indexOf(c.d.name) < 0) E.seen.push(c.d.name);
    });
    if (E.seen.length > 24) E.seen = E.seen.slice(E.seen.length - 24);

    E.winner = null;
    var ds = dealCards();
    if (!ds.length) ds = shuffle(candidates().pool.slice()).slice(0, CARD_COUNT);
    E.cards = ds.map(function(d){ return { d: d, off: false }; });
    setEstate("pick");
    renderCards();
    syncElimChrome();
    setHint("");
  }

  function denyCard(name){
    var el = findCardEl(name);
    if (!el) return;
    el.classList.remove("deny");
    void el.offsetWidth;
    el.classList.add("deny");
    setTimeout(function(){ el.classList.remove("deny"); }, 300);
  }

  /* 定格：一张牌留下，其余消失 */
  function elimPin(d){
    if (!d) return;
    if (E.state === "result" && E.winner && E.winner.name === d.name) return;

    E.winner = d;
    if (S.rolled.indexOf(d.name) < 0){
      S.rolled.push(d.name);
      write("jtsmc.rolled", S.rolled);
    }

    var kids = cardsEl.children;
    for (var i = 0; i < kids.length; i++){
      kids[i].classList.remove("out");
      kids[i].classList.remove("winner");
    }
    var el = findCardEl(d.name);
    if (el) el.classList.add("winner");

    setEstate("result");
    syncElimChrome();
    playSettle();
    vibrate(12);
    liveEl.textContent = "今天吃 " + d.name;
  }

  function onCardClick(name){
    if (E.state !== "pick") return;

    var item = null;
    for (var i = 0; i < E.cards.length; i++){
      if (E.cards[i].d.name === name) item = E.cards[i];
    }
    if (!item) return;

    /* 最后一张不能划掉 */
    if (!item.off && aliveCards().length <= 1){
      denyCard(name);
      setHint("总得留一个");
      vibrate(12);
      return;
    }

    item.off = !item.off;

    var el = findCardEl(name);
    if (el){
      el.classList.toggle("off", item.off);
      el.setAttribute("aria-pressed", String(item.off));
    }

    playTick(!item.off);
    setHint("");

    var alive = aliveCards();
    if (alive.length === 1){
      /* 划到只剩一张，直接定格 */
      elimPin(alive[0].d);
      return;
    }
    liveEl.textContent = "还剩 " + alive.length + " 道";
    syncElimChrome();
  }

  function elimDraw(){
    if (E.state !== "pick" || drawing) return;

    var alive = aliveCards();
    if (alive.length <= 1){
      if (alive.length) elimPin(alive[0].d);
      return;
    }

    drawing = true;
    setEstate("draw");
    syncElimChrome();
    setHint("");

    var winnerItem = alive[Math.floor(Math.random() * alive.length)];
    var losers = alive.filter(function(c){ return c !== winnerItem; });
    shuffle(losers);

    var step = reduced ? 0 : 55;
    losers.forEach(function(c, i){
      setTimeout(function(){
        var el = findCardEl(c.d.name);
        if (el) el.classList.add("out");
      }, step * i);
    });

    /* 抽牌用同一套木签声，轻一档，不抢摇签的主角 */
    playRattle(reduced ? 0.12 : 0.455, 0.6);

    setTimeout(function(){
      drawing = false;
      elimPin(winnerItem.d);
    }, reduced ? 180 : step * losers.length + 240);
  }

  function elimAccept(){
    if (E.state !== "result" || !E.winner) return;
    setEstate("accepted");
    syncElimChrome();
    liveEl.textContent = "就吃 " + E.winner.name;
    vibrate(20);
    startMeal(E.winner);
  }

  function elimBack(){
    if (E.state === "result"){
      /* 回到六张牌，保留划掉状态；赢家自动回到未划掉 */
      E.winner = null;
      setEstate("pick");
      renderCards();
      syncElimChrome();
      setHint("");
      return;
    }
    if (E.state === "accepted" && E.winner){
      if (S.undone.indexOf(E.winner.name) < 0){
        S.undone.push(E.winner.name);
        write("jtsmc.undone", S.undone);
      }
      setEstate("result");
      syncElimChrome();
      liveEl.textContent = "今天吃 " + E.winner.name;
    }
  }

  /* ───────── 玩法三：二选一 ───────── */
  /* 一场最多看几道菜：到顶后不再换牌，最后两张必须点一个结束 */
  var PK_MAX_DISHES = 5;

  function kindOf(d){ return d.tags.indexOf("荤") > -1 ? "荤" : "素"; }
  function hasNoodle(d){ return d.tags.indexOf("面") > -1; }
  function isSea(d){ return d.tags.indexOf("海鲜") > -1; }

  /* 味道的对立面：清淡 ↔ 辣/重口；辣与重口同属「重」，不算反差 */
  function flavorFoes(f){
    if (f === "清淡") return ["辣", "重口"];
    return ["清淡"];
  }

  /* 还没上过场的牌：今日已摇过的不发；整池都摇过时放宽，并在开局时说明 */
  function pkAvailable(){
    return P.basePool.filter(function(d){
      if (P.seen.indexOf(d.name) > -1) return false;
      if (!P.relaxed && S.rolled.indexOf(d.name) > -1) return false;
      return true;
    });
  }

  /* 新换上来的那张逐级放宽：方向相反 → 味道相反 → 荤素相反 → 任意 */
  function pkChallenger(hero){
    var base = pkAvailable();
    if (!base.length) return null;

    var heroF = flavorOf(hero);
    var heroKind = kindOf(hero);
    var heroNoodle = hasNoodle(hero);
    var heroSea = isSea(hero);
    var foes = flavorFoes(heroF);

    var tiers = [
      function(d){
        return foes.indexOf(flavorOf(d)) > -1 && kindOf(d) !== heroKind &&
               (!heroSea || !isSea(d)) && (!heroNoodle || !hasNoodle(d));
      },
      function(d){
        return foes.indexOf(flavorOf(d)) > -1 && kindOf(d) !== heroKind;
      },
      function(d){ return foes.indexOf(flavorOf(d)) > -1; },
      function(d){ return kindOf(d) !== heroKind; },
      function(){ return true; }
    ];

    for (var i = 0; i < tiers.length; i++){
      var seg = base.filter(tiers[i]);
      if (seg.length) return pick(seg);
    }
    return null;
  }

  function findDuelEl(name){
    var kids = duelEl.children;
    for (var i = 0; i < kids.length; i++){
      if (kids[i].dataset.name === name) return kids[i];
    }
    return null;
  }

  function renderDuel(animateRight){
    duelEl.textContent = "";
    duelEl.classList.toggle("solo", !P.challenger);
    if (!P.champion) return;

    duelEl.appendChild(cardButton(P.champion));

    if (P.challenger){
      var vs = document.createElement("span");
      vs.className = "vs";
      vs.setAttribute("aria-hidden", "true");
      vs.textContent = "或";
      duelEl.appendChild(vs);

      var right = cardButton(P.challenger);
      if (animateRight) right.classList.add("in");
      duelEl.appendChild(right);
    }
  }

  function announceDuel(){
    if (!P.champion) return;
    liveEl.textContent = P.challenger
      ? "现在比的是 " + P.champion.name + " 和 " + P.challenger.name
      : "现在只剩 " + P.champion.name;
  }

  function syncPkChrome(){
    var n = pkGone();
    /* 决赛态要收掉空的按钮槽 */
    viewPk.classList.toggle("final", P.state === "face" && P.final);

    if (P.state === "face"){
      if (P.final){
        pkLead.textContent = P.challenger ? "最后两道，选一个就结束" : "就剩它了，点一下";
        pkCount.textContent = n ? "已换掉 " + n + " 道" : "";
      } else {
        pkLead.textContent = "点你想留的那个，另一个换掉";
        pkCount.textContent = "还能换 " + Math.max(0, PK_MAX_DISHES - P.seen.length) + " 次";
      }
      /* 决赛不再给「就吃它」和「换一个」：出路只有点其中一张牌 */
      pkPrimary.hidden = P.final;
      pkPrimary.textContent = "就吃它";
      pkSwap.hidden = P.final || !P.challenger;
      pkUndo.hidden = true;
      pkCopy.hidden = true;
    } else {
      pkCount.textContent = P.seen.length > 2 ? "比了 " + P.seen.length + " 道，最后留下它" : "";
      pkPrimary.hidden = true;
      pkSwap.hidden = true;
      pkUndo.hidden = !P.champion || S.undone.indexOf(P.champion.name) > -1;
      pkCopy.hidden = !P.champion;
      pkCopy.textContent = "复制";
    }

    setChipsDisabled(P.busy);
    setChipsFaded(P.state === "accepted");
  }

  /* 开局 / 重发：清空本场记录，发一对反差最大的牌 */
  function pkDeal(){
    P.seen = [];
    P.final = false;
    P.busy = false;
    setPstate("face");

    var all = candidates().pool;
    var fresh = remaining(all, false);
    P.relaxed = fresh.length < 2;
    P.basePool = P.relaxed ? all.slice() : fresh;

    P.champion = P.basePool.length ? pick(P.basePool) : null;
    if (!P.champion){
      P.challenger = null;
      duelEl.textContent = "";
      pkLead.textContent = "今天没得选了";
      pkCount.textContent = "";
      pkPrimary.hidden = true;
      pkSwap.hidden = true;
      return;
    }

    P.seen.push(P.champion.name);
    P.challenger = pkChallenger(P.champion);
    if (P.challenger) P.seen.push(P.challenger.name);

    /* 只剩一张牌时没有可比的人，直接进决赛态 */
    P.final = !P.challenger;

    renderDuel(true);
    syncPkChrome();
    setHint(P.relaxed && P.basePool.length < 2 ? "今天这几个方向都吃过了，就它吧" : "");
    if (S.view === "pk") announceDuel();
  }

  /* 补一张新牌；补完到顶就进决赛态 */
  function pkNextChallenger(){
    if (P.seen.length >= PK_MAX_DISHES){
      P.challenger = null;
      P.final = true;
      return;
    }
    P.challenger = pkChallenger(P.champion);
    if (P.challenger) P.seen.push(P.challenger.name);
    P.final = !P.challenger || P.seen.length >= PK_MAX_DISHES;
  }

  /* 上过场的牌减去还留在桌上的（1 或 2 张），就是已换掉 */
  function pkGone(){
    return Math.max(0, P.seen.length - (P.challenger ? 2 : 1));
  }

  /* 决赛态点牌 = 直接定下来 */
  function pkDecide(name){
    if (P.busy) return;
    var keepChampion = name === P.champion.name;
    if (!keepChampion && (!P.challenger || name !== P.challenger.name)) return;

    if (!keepChampion){
      var old = P.champion;
      P.champion = P.challenger;
      P.challenger = old;
    }
    /* 两张牌都留着：点「再想想」能回到同一对，还能翻盘 */
    renderDuel(false);
    pkAccept();
  }

  function pkChoose(name){
    if (P.state !== "face" || P.busy) return;
    if (name !== P.champion.name && (!P.challenger || name !== P.challenger.name)) return;

    /* 决赛：这一下就是决定 */
    if (P.final){
      pkDecide(name);
      return;
    }

    var keepChampion = name === P.champion.name;
    var loser = keepChampion ? P.challenger.name : P.champion.name;

    P.busy = true;
    playTick(true);
    setHint("");

    if (!keepChampion) P.champion = P.challenger;

    var loserEl = findDuelEl(loser);
    if (loserEl) loserEl.classList.add("out");

    /* 先落败的那张淡出，再补新牌，避免两张同时动 */
    setTimeout(function(){
      pkNextChallenger();
      renderDuel(true);
      P.busy = false;
      syncPkChrome();
      announceDuel();
    }, reduced ? 0 : 170);
  }

  /* 两个都不想吃：只换新上来那张，台上那张不动，也不记进换掉 */
  function pkSwapOut(){
    if (P.state !== "face" || P.busy || P.final || !P.challenger) return;

    P.busy = true;
    playTick(false);
    setHint("");

    var old = findDuelEl(P.challenger.name);
    if (old) old.classList.add("out");

    setTimeout(function(){
      pkNextChallenger();
      renderDuel(true);
      P.busy = false;
      syncPkChrome();
      announceDuel();
    }, reduced ? 0 : 120);
  }

  function pkAccept(){
    if (P.state !== "face" || !P.champion || P.busy) return;

    setPstate("accepted");
    if (S.rolled.indexOf(P.champion.name) < 0){
      S.rolled.push(P.champion.name);
      write("jtsmc.rolled", S.rolled);
    }

    var el = findDuelEl(P.champion.name);
    if (el) el.classList.add("winner");

    syncPkChrome();
    playSettle();
    vibrate(12);
    setTimeout(function(){ vibrate(20); }, 200);
    liveEl.textContent = "就吃 " + P.champion.name;
    startMeal(P.champion);
  }

  function pkBack(){
    if (P.state !== "accepted" || !P.champion) return;
    if (S.undone.indexOf(P.champion.name) < 0){
      S.undone.push(P.champion.name);
      write("jtsmc.undone", S.undone);
    }
    /* 决赛翻案：刚被换掉的那张回到牌桌，计数由 pkGone 自动回退 */
    setPstate("face");
    renderDuel(false);
    syncPkChrome();
    setHint("");
    announceDuel();
  }

  function applyView(v, persist){
    S.view = v;
    if (persist) write("jtsmc.view", v);

    viewSign.hidden = v !== "sign";
    viewElim.hidden = v !== "elim";
    viewPk.hidden   = v !== "pk";

    tabSign.setAttribute("aria-selected", String(v === "sign"));
    tabElim.setAttribute("aria-selected", String(v === "elim"));
    tabPk.setAttribute("aria-selected", String(v === "pk"));
    setHint("");

    if (v === "sign"){
      setChipsFaded(S.state === "accepted" || S.state === "exhausted");
      setChipsDisabled(S.state === "rolling");
      /* 视图隐藏时 clientHeight 为 0，切回来必须重算字号 */
      if (S.dish && (S.state === "result" || S.state === "accepted")) sizeName(S.dish.name);
      if (S.state === "exhausted") sizeName("今日签已尽");
    } else if (v === "elim"){
      setChipsFaded(E.state === "accepted");
      setChipsDisabled(E.state === "draw");
    } else {
      setChipsFaded(P.state === "accepted");
      setChipsDisabled(P.busy);
    }
    syncMeal();
  }

  /* ───────── 复制 ───────── */
  function legacyCopy(text){
    try{
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.top = "-1000px";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, text.length);
      var ok = document.execCommand("copy");
      document.body.removeChild(ta);
      return ok;
    }catch(e){ return false; }
  }

  function copyResult(btn, name){
    if (!name) return;
    var text = "今天吃：" + name;
    function done(ok){
      btn.textContent = ok ? "已复制" : "复制失败";
      liveEl.textContent = ok ? "已复制" : "复制失败";
      setTimeout(function(){
        if (!btn.hidden) btn.textContent = "复制";
      }, 1200);
    }
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ done(true); }, function(){ done(legacyCopy(text)); });
    } else {
      done(legacyCopy(text));
    }
  }

  /* ───────── 长按「再摇一签」：跳过当前这道所属的味道 ───────── */
  var PRESS_MS = 450;
  var pressTimer = null;
  var suppressSecondaryClick = false;

  function clearPressTimer(){
    if (pressTimer){ clearTimeout(pressTimer); pressTimer = null; }
  }

  function excludeCurrentFlavor(){
    if (S.state !== "result" || !S.dish) return;
    var flavor = flavorOf(S.dish);
    var notice = "";

    /* chip 正在强制这个味道时，用户的长按就是明确要关掉它 */
    if (flavor === "清淡" && S.gentle){
      S.gentle = false;
      syncChips();
      notice = "先关掉「清淡点」";
    }

    if (S.exclude.indexOf(flavor) < 0){
      if (S.exclude.length >= 2){
        S.exclude = [];
        notice = "三种都排完了，重新来过";
      } else {
        S.exclude.push(flavor);
        if (!notice) notice = "这次不要「" + flavor + "」的";
      }
    }

    vibrate(12);
    playTick(false);
    roll(false, notice);
  }

  /* ───────── 事件 ───────── */
  primary.addEventListener("click", function(){
    var a = primary.dataset.action;
    if (a === "accept") accept();
    else if (a === "roll") roll(false);
  });

  secondary.addEventListener("pointerdown", function(e){
    if (S.state !== "result" || secondary.dataset.action !== "roll") return;
    if (e.pointerType === "mouse" && e.button !== 0) return;
    /* 新的一次按下说明上回手势已经结束，顺手解除残留的 click 抑制 */
    suppressSecondaryClick = false;
    clearPressTimer();
    pressTimer = setTimeout(function(){
      pressTimer = null;
      suppressSecondaryClick = true;
      excludeCurrentFlavor();
    }, PRESS_MS);
  });

  /* 长按已经生效，松手后的 click 不该再摇一次 */
  function endPress(){
    clearPressTimer();
  }

  /* 键盘操作没有 pointerdown，直接清掉残留的抑制 */
  secondary.addEventListener("keydown", function(e){
    if (e.key === "Enter" || e.key === " " || e.key === "Spacebar") suppressSecondaryClick = false;
  });
  secondary.addEventListener("pointerup", endPress);
  secondary.addEventListener("pointercancel", endPress);
  secondary.addEventListener("pointerleave", endPress);
  secondary.addEventListener("contextmenu", function(e){ e.preventDefault(); });

  secondary.addEventListener("click", function(){
    if (suppressSecondaryClick){
      suppressSecondaryClick = false;
      return;
    }
    var a = secondary.dataset.action;
    if (a === "undo") undo();
    else if (a === "outlet"){
      if (S.outletUsed) return;
      S.outletUsed = true;
      roll(true);
    }
    else roll(false);
  });

  copyBtn.addEventListener("click", function(){
    copyResult(copyBtn, menuText() || (S.dish && S.dish.name));
  });

  /* ───────── 一餐的事件 ───────── */
  mealBlocks.forEach(function(block){
    block.querySelector(".meal-soup").addEventListener("click", addSoup);
    block.querySelector(".meal-add").addEventListener("click", addSide);
  });

  /* ───────── 玩法二的事件 ───────── */
  cardsEl.addEventListener("click", function(e){
    var el = e.target.closest ? e.target.closest(".card") : null;
    if (!el) return;
    onCardClick(el.dataset.name);
  });

  elimPrimary.addEventListener("click", function(){
    var a = elimPrimary.dataset.action;
    if (a === "draw") elimDraw();
    else if (E.state === "result") elimAccept();
    else if (E.state === "pick"){
      var alive = aliveCards();
      if (alive.length === 1) elimPin(alive[0].d);
    }
  });

  elimShuffle.addEventListener("click", function(){
    if (E.state !== "pick") return;
    playTick(false);
    elimReset();
    liveEl.textContent = "换了一组";
  });

  elimUndo.addEventListener("click", elimBack);

  elimCopy.addEventListener("click", function(){
    copyResult(elimCopy, menuText() || (E.winner && E.winner.name));
  });

  /* ───────── 玩法三的事件 ───────── */
  duelEl.addEventListener("click", function(e){
    var el = e.target.closest ? e.target.closest(".card") : null;
    if (!el) return;
    pkChoose(el.dataset.name);
  });

  pkPrimary.addEventListener("click", pkAccept);
  pkSwap.addEventListener("click", pkSwapOut);
  pkUndo.addEventListener("click", pkBack);
  pkCopy.addEventListener("click", function(){
    copyResult(pkCopy, menuText() || (P.champion && P.champion.name));
  });

  /* ───────── 玩法切换 ───────── */
  var TABS = [
    { view: "sign", tab: tabSign },
    { view: "elim", tab: tabElim },
    { view: "pk",   tab: tabPk }
  ];

  TABS.forEach(function(item, idx){
    item.tab.addEventListener("click", function(){ applyView(item.view, true); });

    item.tab.addEventListener("keydown", function(e){
      if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
      e.preventDefault();
      var step = e.key === "ArrowRight" ? 1 : -1;
      var next = TABS[(idx + step + TABS.length) % TABS.length];
      applyView(next.view, true);
      next.tab.focus();
    });
  });

  /* 结果 / 签尽状态下改条件：作废当前画面，回到待摇，不自动重摇。
     另外两个玩法也必须跟着重发牌，否则切过去会看到不合新条件的牌。 */
  function afterChipChange(){
    if (S.view === "elim" && E.state === "draw") return;
    if (S.view === "pk" && P.busy) return;

    if (S.state === "result" || S.state === "exhausted") toIdle();
    if (E.state !== "draw" && E.state !== "accepted") elimReset();
    if (!P.busy && P.state !== "accepted") pkDeal();
  }

  /* ───────── AI 筛选 ───────── */
  function syncAI(){
    aiBtn.hidden = !AI;
    aiBtn.classList.toggle("on", !!S.ai);
    aiBtn.setAttribute("aria-label",
      S.ai ? ("AI 条件：" + S.ai.label + "，点这里修改") : "用一句话筛菜");
    aiBtn.title = S.ai ? ("AI 条件：" + S.ai.label) : "用一句话筛菜";
    if (S.ai) aiTip.hidden = true;
    aiClear.hidden = !S.ai;
  }

  function aiCacheKey(q){ return AI_CACHE + q; }

  /* 四级降级：本地缓存 → 请求 → 超时/坏 JSON → 全库。任何一步失败都只回 null */
  function askAI(q, done){
    if (!AI){ done(null); return; }
    try {
      var hit = localStorage.getItem(aiCacheKey(q));
      if (hit){
        var c = JSON.parse(hit);
        if (c && c.ok && c.dishes && c.dishes.length >= 2 && Date.now() - (c.t || 0) < AI_CACHE_TTL){
          done(c);
          return;
        }
      }
    } catch(e){}

    var ctl = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function(){ if (ctl) ctl.abort(); }, AI_TIMEOUT);

    fetch(AI + "?q=" + encodeURIComponent(q), ctl ? { signal: ctl.signal } : {})
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(d){
        clearTimeout(timer);
        if (!d || !d.ok || !d.dishes){ done(null, (d && d.why) || "parse"); return; }
        /* 服务端已经校验过一遍，客户端再挡一次：菜名必须在本地菜库里 */
        var names = d.dishes.filter(function(n){ return !!DISH_BY_NAME[n]; });
        if (names.length < 2){ done(null, "few"); return; }
        var res = { ok: true, dishes: names, label: String(d.label || ""), t: Date.now() };
        try { localStorage.setItem(aiCacheKey(q), JSON.stringify(res)); } catch(e){}
        done(res);
      })
      .catch(function(){ clearTimeout(timer); done(null, "timeout"); });
  }

  function applyAI(res, q){
    S.ai = {
      label: (res.label || q || "刚刚说的").slice(0, 12),
      names: res.dishes
    };
    syncAI();
    afterChipChange();
    setHint("");
    playTick(true);
    vibrate(8);
    liveEl.textContent = "AI 挑了 " + res.dishes.length + " 道";
  }

  function clearAI(){
    if (!S.ai) return;
    S.ai = null;
    syncAI();
    afterChipChange();
    setHint("");
    playTick(false);
    liveEl.textContent = "回到全部菜";
  }

  function openSheet(){
    if (!AI) return;
    aiSheet.hidden = false;
    syncAI();
    setTimeout(function(){ aiInput.focus(); }, 40);
  }

  function closeSheet(){
    if (aiSheet.hidden) return;
    aiSheet.hidden = true;
    aiBtn.focus();
  }

  function runAI(){
    var q = aiInput.value.trim();
    if (!q || aiGo.disabled) return;
    aiGo.disabled = true;
    aiGo.textContent = "正在看菜谱…";
    askAI(q, function(res, why){
      aiGo.disabled = false;
      aiGo.textContent = "帮我筛";
      closeSheet();
      if (res){
        applyAI(res, q);
        return;
      }
      /* 失败也分语气：排队、问太勤、太慢、没看懂。都不弹错误框 */
      var msg = why === "rate" ? "AI 今天问得有点勤，先用全部菜"
              : (why === "busy" ? "模型这会儿排队，先用全部菜"
              : (why === "timeout" ? "这次问得太久，先用全部菜" : "这次没筛成，先用全部菜"));
      setHint(msg);
      setTimeout(function(){
        if (!S.ai && hintEl.textContent === msg) setHint("");
      }, 4000);
    });
  }

  /* 打完字停 1.2 秒就先问一次，进缓存；点“帮我筛”时通常已经回来了 */
  var composing = false, prefetchTimer = 0;
  function schedulePrefetch(){
    if (composing) return;
    clearTimeout(prefetchTimer);
    var q = aiInput.value.trim();
    if (q.length < 2) return;
    prefetchTimer = setTimeout(function(){ askAI(q, function(){}); }, 1200);
  }

  aiBtn.addEventListener("click", function(){ aiTip.hidden = true; openSheet(); });

  /* 首次进入说一次“这里是干嘛的”：只出现一次，已有 AI 条件时不出现 */
  if (AI && !read("jtsmc.ai.tip", 0)){
    setTimeout(function(){
      if (!S.ai && !aiBtn.hidden){
        aiTip.hidden = false;
        write("jtsmc.ai.tip", 1);
        setTimeout(function(){ aiTip.hidden = true; }, 6000);
      }
    }, 1200);
  }
  aiMask.addEventListener("click", closeSheet);
  aiGo.addEventListener("click", runAI);
  aiClear.addEventListener("click", function(){ clearAI(); closeSheet(); });

  [].forEach.call(aiSheet.querySelectorAll(".sheet-egs button"), function(b){
    b.addEventListener("click", function(){
      aiInput.value = b.getAttribute("data-q");
      aiInput.focus();
      schedulePrefetch();
    });
  });

  aiInput.addEventListener("compositionstart", function(){ composing = true; });
  aiInput.addEventListener("compositionend", function(){ composing = false; schedulePrefetch(); });
  aiInput.addEventListener("input", schedulePrefetch);
  aiInput.addEventListener("keydown", function(e){
    if (e.key === "Enter"){ e.preventDefault(); runAI(); }
  });

  /* 提示行在“AI 条件”状态下可点，打开同一张纸片去改 */
  hintEl.addEventListener("click", function(){
    if (hintEl.classList.contains("ai")) openSheet();
  });

  document.addEventListener("keydown", function(e){
    if (e.key === "Escape" && !aiSheet.hidden) closeSheet();
  });

  chipNoSpicy.addEventListener("click", function(){
    if (rolling) return;
    S.noSpicy = !S.noSpicy;
    write("jtsmc.noSpicy", S.noSpicy);
    syncChips();
    playTick(S.noSpicy);
    afterChipChange();
  });

  chipGentle.addEventListener("click", function(){
    if (rolling) return;
    S.gentle = !S.gentle;
    syncChips();
    playTick(S.gentle);
    afterChipChange();
  });

  chipNoodle.addEventListener("click", function(){
    if (rolling) return;
    S.noodle = !S.noodle;
    syncChips();
    playTick(S.noodle);
    afterChipChange();
  });

  soundBtn.addEventListener("click", function(){
    S.muted = !S.muted;
    write("jtsmc.muted", S.muted);
    if (S.muted) silence();
    syncSound();
    if (!S.muted) playSettle();
  });

  /* ───────── 启动 ───────── */
  window.addEventListener("resize", function(){
    if (viewSign.hidden) return;
    if (S.dish && (S.state === "result" || S.state === "accepted")) sizeName(S.dish.name);
    if (S.state === "exhausted") sizeName("今日签已尽");
  });

  syncDay();
  syncChips();
  syncSound();
  syncAI();
  toIdle();
  elimReset();
  pkDeal();
  applyView(S.view, false);
})();
</script>
</body>
</html>
